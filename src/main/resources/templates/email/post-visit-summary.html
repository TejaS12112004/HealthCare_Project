<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { padding: 20px; border: 1px solid #ddd; max-width: 600px; margin: 0 auto; }
        .header { background-color: #e0f7fa; padding: 10px; text-align: center; font-weight: bold; }
        .section { margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">Your Post-Visit Summary</div>
    <p>Dear <span th:text="${patientName}">Patient</span>,</p>
    <p>Here is a summary of your recent visit.</p>
    
    <div class="section">
        <h3>Summary</h3>
        <p th:text="${patientFriendlySummary}">Summary goes here.</p>
    </div>
    
    <div class="section">
        <h3>Medication Schedule</h3>
        <p th:text="${medicationSchedule}">Medication Schedule goes here.</p>
    </div>
    
    <div class="section">
        <h3>Follow Up Steps</h3>
        <p th:text="${followUpSteps}">Follow up steps goes here.</p>
    </div>
    
    <p>Take care!</p>
</div>
</body>
</html>
