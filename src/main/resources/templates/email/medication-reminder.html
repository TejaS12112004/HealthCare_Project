<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { padding: 20px; border: 1px solid #ddd; max-width: 600px; margin: 0 auto; }
        .header { background-color: #c8e6c9; padding: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">Medication Reminder</div>
    <p>Dear <span th:text="${patientName}">Patient</span>,</p>
    <p>This is a reminder to take your medication.</p>
    <p><strong>Medication:</strong> <span th:text="${medicationName}">Medicine</span></p>
    <p><strong>Dosage:</strong> <span th:text="${dosage}">Dosage</span></p>
    <p><strong>Time:</strong> <span th:text="${time}">Time</span></p>
    <p><em>Tip: Take with water!</em></p>
</div>
</body>
</html>
