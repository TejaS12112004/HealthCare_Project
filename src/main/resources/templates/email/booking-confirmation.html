<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { padding: 20px; border: 1px solid #ddd; max-width: 600px; margin: 0 auto; }
        .header { background-color: #f4f4f4; padding: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">Booking Confirmation</div>
    <p>Dear <span th:text="${patientName}">Patient</span>,</p>
    <p>Your appointment with Dr. <span th:text="${doctorName}">Doctor</span> has been confirmed.</p>
    <p><strong>Date:</strong> <span th:text="${date}">Date</span></p>
    <p><strong>Time:</strong> <span th:text="${time}">Time</span></p>
    <p><strong>Location:</strong> Online Consultation</p>
    <p>Thank you for submitting your pre-visit symptom form. The doctor will review it before your visit.</p>
</div>
</body>
</html>
