<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { padding: 20px; border: 1px solid #ddd; max-width: 600px; margin: 0 auto; }
        .header { background-color: #f44336; color: white; padding: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">Cancellation Notice</div>
    <p>Dear <span th:text="${patientName}">Patient</span>,</p>
    <p>We are writing to inform you that your appointment with Dr. <span th:text="${doctorName}">Doctor</span> has been cancelled.</p>
    <p><strong>Reason:</strong> <span th:text="${reason}">Reason</span></p>
    <p>Please click here to rebook your appointment: <a href="#">Rebook Now</a></p>
</div>
</body>
</html>
